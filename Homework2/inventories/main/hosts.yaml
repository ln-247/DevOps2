all:
  vars:
    ansible_user: user  # SSH пользователь, используемый Ansible
    ansible_ssh_private_key_file: "~/.ssh/id_ed25519"  # Путь к приватному SSH ключу на контроллере
  hosts:
    vm1:
      ansible_host: 127.0.0.1 # Адрес, используемый Ansible для подключения. Должен быть доступен с контроллера
  children:
    part1:
      hosts:
        vm1:
