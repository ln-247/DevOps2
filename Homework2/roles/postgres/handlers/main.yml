- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart PostgreSQL
  ansible.builtin.systemd_service:
    name: postgres.service
    state: restarted

- name: Restart PostgreSQL Exporter
  ansible.builtin.systemd_service:
    name: postgres_exporter.service
    state: restarted